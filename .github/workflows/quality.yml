name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrition_test
          POSTGRES_USER: nutrition
          POSTGRES_PASSWORD: nutrition_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutrition -d nutrition_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nutrition:nutrition_dev@localhost:5432/nutrition_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: >-
          VITE_API_URL=https://api.example.invalid
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          build backend frontend
